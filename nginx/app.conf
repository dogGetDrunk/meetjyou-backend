# Mirror of the live server config: ~/meetjyou/data/nginx/app.conf on the EC2 host.
# NOT deployed by CI. deploy.yml only checks that the server file exists, so edit the
# server file, run "docker exec nginx nginx -t", reload, then copy the result here.

server {
    listen 80;
    server_name meetjyou.duckdns.org;
    server_tokens off;
    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name meetjyou.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/meetjyou.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetjyou.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CORS headers on every response
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    location / {
        proxy_pass http://spring_boot:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        # Rewrite http redirects (e.g. Swagger) to https
        proxy_redirect http:// https://;
    }

    # Answer CORS preflight directly
    location /options {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        return 204;
    }

    # Block dotfiles
    location ~ /\.(?!well-known) {
        return 404;
    }

    # WebSocket for chat
    location /ws-chat {
        proxy_pass http://spring_boot:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
