name: CI

on:
  pull_request:
    branches:
      - main
  # Runs after each merge so the Gradle dependency cache is saved in main's scope: a cache saved
  # by a pull_request run is visible only to that PR, while every PR can restore main's.
  # Also checks the merged main itself.
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Amazon Corretto JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          # Caches the Gradle wrapper and dependencies, keyed on the build files' hash.
          cache: 'gradle'

      - name: Agent process hook tests
        run: python3 .claude/hooks/test_hooks.py

      # One Gradle invocation for both, instead of paying JVM startup + configuration twice.
      # dockerTest needs a Docker daemon (Testcontainers MySQL); GitHub-hosted runners provide one.
      - name: Build & Test + preference seed consistency test
        run: ./gradlew build dockerTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
