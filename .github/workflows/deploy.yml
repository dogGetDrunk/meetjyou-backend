name: Deploy to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Deploy only when the shipped image or host config can change. The image is built from
    # src/main + Gradle build files (bootJar skips tests/detekt, so src/test, src/dockerTest and
    # config/ are excluded); docker-compose.yml is uploaded to the host. Anything else
    # (.claude/, docs/, ci.yml) would just redeploy an identical image.
    # workflow_dispatch above remains for manual redeploys.
    paths:
      - 'src/main/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Amazon Corretto JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: QEMU 등록 (arm64 크로스 빌드용 — ubuntu-latest는 기본 미등록)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Buildx 빌더 설정 (멀티플랫폼 빌드 드라이버)
        uses: docker/setup-buildx-action@v3

      # Native builds take ~3 min. A regression past this limit (e.g. Gradle running under QEMU
      # again, which went unnoticed at 25 min) fails the deploy and triggers the Discord alert.
      - name: Docker 이미지 빌드 & 푸시 (latest + git SHA 태그, amd64+arm64 멀티아치)
        timeout-minutes: 12
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/meetjyou:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/meetjyou:${{ github.sha }} \
            --push .

      - name: 서버에 docker-compose.yml 업로드
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/meetjyou/"

      - name: 서버에 .env 업로드
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat <<EOF > ~/meetjyou/.env
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            SPRING_SECURITY_USER_NAME=${{ secrets.SPRING_SECURITY_USER_NAME }}
            SPRING_SECURITY_USER_PASSWORD=${{ secrets.SPRING_SECURITY_USER_PASSWORD }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER }}
            JWT_AT_EXP=${{ secrets.JWT_AT_EXP }}
            JWT_RT_EXP=${{ secrets.JWT_RT_EXP }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            DNS_URL=${{ secrets.DNS_URL }}
            OCI_BUCKET_NAME=${{ secrets.OCI_BUCKET_NAME }}
            OCI_NAMESPACE=${{ secrets.OCI_NAMESPACE }}
            OCI_PAR_EXPIRATION_MINUTES=${{ secrets.OCI_PAR_EXPIRATION_MINUTES }}
            OCI_REGION=${{ secrets.OCI_REGION }}
            OCI_AUTH_MODE=${{ secrets.OCI_AUTH_MODE }}
            OCI_CONFIG_FILE_PATH=${{ secrets.OCI_CONFIG_FILE_PATH }}
            OCI_PROFILE=${{ secrets.OCI_PROFILE }}
            KAKAO_ISSUER=${{ secrets.KAKAO_ISSUER }}
            KAKAO_JWKS_URI=${{ secrets.KAKAO_JWKS_URI }}
            KAKAO_ACCESS_TOKEN_INFO_URI=${{ secrets.KAKAO_ACCESS_TOKEN_INFO_URI }}
            KAKAO_USER_INFO_URI=${{ secrets.KAKAO_USER_INFO_URI }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_APP_ID=${{ secrets.KAKAO_APP_ID }}
            KAKAO_CLOCK_SKEW_SECONDS=${{ secrets.KAKAO_CLOCK_SKEW_SECONDS }}
            KAKAO_JWK_CACHE_TTL_MINUTES=${{ secrets.KAKAO_JWK_CACHE_TTL_MINUTES }}
            GOOGLE_ISSUER=${{ secrets.GOOGLE_ISSUER }}
            GOOGLE_CLIENT_ID_ANDROID=${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}
            GOOGLE_CLIENT_ID_WEB=${{ secrets.GOOGLE_CLIENT_ID_WEB }}
            APPLE_ISSUER=${{ secrets.APPLE_ISSUER }}
            APPLE_JWKS_URI=${{ secrets.APPLE_JWKS_URI }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_CLOCK_SKEW_SECONDS=${{ secrets.APPLE_CLOCK_SKEW_SECONDS }}
            APPLE_JWK_CACHE_TTL_MINUTES=${{ secrets.APPLE_JWK_CACHE_TTL_MINUTES }}
            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
            ADMIN_CLAIM_PASSPHRASE=${{ secrets.ADMIN_CLAIM_PASSPHRASE }}
            LOAD_TEST_TOKEN_ENABLED=${{ secrets.LOAD_TEST_TOKEN_ENABLED }}
            LOAD_TEST_TOKEN_SECRET=${{ secrets.LOAD_TEST_TOKEN_SECRET }}
            COMPOSE_PROJECT_NAME=meetjyou
            IMAGE_TAG=${{ github.sha }}
            EOF

      # firebase-adminsdk.json / oci/config / oci/private-key.pem are not managed by git or
      # GitHub Secrets — they're placed manually on the server filesystem, so they're easy to
      # miss when moving to a new host (this exact gap broke the first AWS migration deploy).
      - name: 호스트 파일 시크릿 존재 확인 (수동 배치 대상, CI 미관리)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            MISSING=0
            for f in ~/meetjyou/data/spring_boot/firebase-adminsdk.json ~/meetjyou/data/spring_boot/oci/config ~/meetjyou/data/spring_boot/oci/private-key.pem ~/meetjyou/data/nginx/app.conf; do
              if [ ! -f "$f" ]; then
                echo "Missing required file secret: $f (not managed by git/GitHub Secrets — must be placed manually on the host)"
                MISSING=1
              fi
            done
            if [ "$MISSING" = "1" ]; then
              exit 1
            fi

      - name: 배포 + 헬스체크 + 실패 시 자동 롤백
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/meetjyou

            # nginx resolves "spring_boot" to its Docker network IP only at config load, and a
            # recreated container can get a new internal IP (the host's EIP is unaffected) —
            # without a reload nginx keeps proxying to the stale IP (502).
            # Retries cover the race right after nginx (re)starts, before its pid file exists.
            reload_nginx() {
              for i in $(seq 1 5); do
                docker compose exec -T nginx nginx -s reload && return 0
                sleep 2
              done
              echo "nginx reload 실패 — 공개 도메인이 이전 컨테이너 IP로 프록시 중일 수 있음"
              return 1
            }

            # Pull while the old app is still serving, so image download time isn't downtime.
            docker compose pull
            # Replace only the app. The old "compose down" also stopped nginx (10s on its own,
            # its sh-loop command ignores SIGTERM) and certbot, adding to every deploy's downtime.
            docker compose up -d --no-deps spring_boot

            echo "헬스체크 대기 중... (최대 300초 대기)"
            HEALTHY=false
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:8081/actuator/health | grep -q '"status":"UP"'; then
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "${{ github.sha }}" > CURRENT_TAG
              echo "배포 성공: ${{ github.sha }}"
              # Applies docker-compose.yml changes to nginx/certbot (or starts them on a fresh
              # host); a no-op when their config is unchanged.
              docker compose up -d --no-deps nginx certbot
              reload_nginx || exit 1
              # Only prune on a confirmed-healthy deploy — old tags stick around after a
              # rollback so the failed image is still there to inspect while debugging.
              docker image prune -a -f
            else
              echo "헬스체크 실패, 이전 버전으로 롤백합니다."
              PREV_TAG=$(cat CURRENT_TAG 2>/dev/null || echo "latest")
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREV_TAG/" .env
              docker compose pull spring_boot
              docker compose up -d --no-deps spring_boot
              reload_nginx
              echo "롤백 완료: $PREV_TAG"
              exit 1
            fi

      # 이 워크플로우는 실패해도 어디에도 알림이 안 가서 배포 중단이 2주간 방치된 적이 있음.
      # if: failure()는 위 단계들 중 하나라도 실패하면(도커 빌드, 업로드, 헬스체크 전부 포함) 실행됨.
      - name: 배포 실패 시 Discord 알림
        if: failure()
        run: |
          curl -sf -H "Content-Type: application/json" -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -d @- <<'PAYLOAD'
          {
            "embeds": [{
              "title": "🚨 배포 실패: ${{ github.repository }}",
              "color": 16711680,
              "fields": [
                { "name": "Workflow", "value": "${{ github.workflow }}", "inline": true },
                { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                { "name": "Actor", "value": "${{ github.actor }}", "inline": true },
                { "name": "Commit", "value": "${{ github.sha }}", "inline": false },
                { "name": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "inline": false }
              ]
            }]
          }
          PAYLOAD
